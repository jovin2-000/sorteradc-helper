<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SorterADC Helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-left">
      <span class="logo">ADC Helper</span>
      <select id="flow-select" class="select"><option value="">选择流程...</option></select>
      <select id="product-select" class="select" style="display:none"><option value="">选择产品...</option></select>
      <input type="text" id="new-product-id" class="text-input" placeholder="新产品ID" style="display:none">
    </div>
    <div class="topbar-center">
      <button id="btn-upload" class="btn btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>上传图片</span>
      </button>
      <input type="file" id="file-input" accept="image/*" style="display:none">
      <select id="test-image-select" class="select" style="min-width:240px"><option value="">或选择测试图...</option></select>
      <button id="btn-run" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>运行全流程</span>
      </button>
    </div>
    <div class="topbar-right">
      <button id="btn-save-template" class="btn" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        <span>保存模板</span>
      </button>
      <button id="btn-save" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        <span>保存参数</span>
      </button>
      <button id="btn-reset" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span>重置</span>
      </button>
      <span id="status-indicator" class="status-idle">就绪</span>
    </div>
  </header>

  <div id="main-body">
    <aside id="sidebar">
      <div id="param-panel"><div class="sidebar-loading">加载中...</div></div>
    </aside>
    <main id="content">
      <div id="pipeline-view">
        <div class="empty-state">
          <p>选择流程和图片后点击「运行全流程」</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ROI drawing overlay -->
  <div id="roi-overlay" class="roi-overlay" style="display:none">
    <div class="roi-overlay-header">
      <span>请在图像上绘制矩形框选 die 区域</span>
      <div class="roi-overlay-actions">
        <span id="roi-coords" class="roi-coords"></span>
        <button id="btn-roi-clear" class="btn btn-sm">清除</button>
        <button id="btn-roi-confirm" class="btn btn-primary btn-sm">确认ROI</button>
        <button id="btn-roi-cancel" class="btn btn-sm">取消</button>
      </div>
    </div>
    <div class="roi-canvas-wrapper">
      <canvas id="roi-canvas"></canvas>
    </div>
  </div>

  <div id="lightbox" class="lightbox" style="display:none">
    <div class="lightbox-inner">
      <img id="lightbox-img" src="">
      <button id="lightbox-close" class="btn-close">&times;</button>
    </div>
  </div>
</div>
<script src="flowbuilder.js"></script>
<script src="app.js"></script>
</body>
</html>

<!-- Flow builder overlay -->
<div id="flow-builder-overlay" class="fb-overlay" style="display:none">
  <div class="fb-panel">
    <div class="fb-header">
      <span>流程编辑器</span>
      <button id="fb-close" class="btn-close">&times;</button>
    </div>
    <div class="fb-body">
      <div class="fb-col fb-avail">
        <div class="fb-col-title">可用算子</div>
        <div id="fb-available" class="fb-list"></div>
      </div>
      <div class="fb-col fb-sel">
        <div class="fb-col-title">已选流程 <span id="fb-count"></span></div>
        <div id="fb-selected" class="fb-list"></div>
      </div>
    </div>
    <div class="fb-footer">
      <input type="hidden" id="fb-id">
      <input type="text" id="fb-name" class="text-input" placeholder="流程名称">
      <button id="fb-save" class="btn btn-primary btn-sm">保存流程</button>
    </div>
  </div>
</div>
